<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <title> Prac </title>
    </head>
    <body>
        <h1>CatphotoApp</h1>
        <main class="container">
            <h3>Cat Photos</h3>
            <!-- TODO: Add link to photos-->
            <p>Click here to view more <a href="https://catphotos.com" target="_blank">cat photos</a></p>
            
            <img src="https://fcc.im/fcc-relaxing-cat" alt="A cat.">
            <h3> Cat Lists</h3>
            <div class="lists">
                <p>Things Cats love:</p>
                <ul>
                    <li>Cat nip</li>
                    <li>Laser pointers</li>
                    <li>Lasagna</li>
                </ul>
                <img src="lasagna.jpg">
                <p>Things cat hate:</p>
                <ul>
                    <li>Other cats</li>
                    <li>Thunder</li>
                </ul>
            </div>
            <img src="cats.jpg">
            <form action="/submit-cat-photo">
                <label for="indoor"><input id="indoor" type="radio" name="indoor-outdoor" checked> Indoor</label><br>
                <label for="outdoor"><input id="outdoor" type="radio" name="indoor-outdoor"> Outdoor</label><br>

                <label for="Lazy"><input id="Lazy" type="checkbox" name="personaluty"> Lazy</label><br>
                <label for="Energetic"><input id="Energetic" type="checkbox" name="personaluty"> Energetic</label><br>

                <input type="text" id="catUrlInput" placeholder="Cat Photo URL" required> <br>
                <button type="button" id="submitBtn">Submit</button>
                <p id="message"></p>

            </form>
        </main>
        <footer>
            <p><small><small>
                ABCD</small></small>
            </p>

        </footer>
        <script>
  const input = document.getElementById("catUrlInput");
  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");

  button.addEventListener("click", function () {
    const value = input.value;

    if (value === "") {
      message.textContent = "Please enter a cat image URL";
    } else {
      message.textContent = "You entered: " + value;
    }
  });
</script>

    </body>
</html>
