<!DOCTYPE html>
<html lang="en">
    <head>
        <link rel="stylesheet" href="style.css">
        <title> Prac </title>
    </head>
    <body>
        <h1>CatphotoApp</h1>
        <main class="container">
            <h3>Cat Photos</h3>
            <!-- TODO: Add link to photos-->
            <p>Click here to view more <a href="https://catphotos.com" target="_blank">cat photos</a></p>
            
            <img id="catImage"
                 src="https://cdn.freecodecamp.org/curriculum/cat-photo-app/relaxing-cat.jpg" 
                 alt="A relaxing cat.">
            <h3> Cat Lists</h3>
            <div class="lists">
                <p>Things Cats love:</p>
                <ul>
                    <li>Cat nip</li>
                    <li>Laser pointers</li>
                    <li>Lasagna</li>
                </ul>
                <img id="lasagnaImage"
                    src="https://www.countryliving.com/life/kids-pets/g63904662/white-cats-breeds-facts/"
                    alt="Lasagna img">
                <p>Things cat hate:</p>
                <ul>
                    <li>Other cats</li>
                    <li>Thunder</li>
                </ul>
            </div>
            <img id="thunderImage"
                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT0oUNL6468es1P6PZ_vY0J_MNkGVUgKglmqg&s"
                alt="Thunder Image">
            <form action="/submit-cat-photo">
                <label for="indoor"><input id="indoor" type="radio" name="indoor-outdoor" checked> Indoor</label><br>
                <label for="outdoor"><input id="outdoor" type="radio" name="indoor-outdoor"> Outdoor</label><br>

                <label for="Lazy"><input id="Lazy" type="checkbox" name="personaluty"> Lazy</label><br>
                <label for="Energetic"><input id="Energetic" type="checkbox" name="personaluty"> Energetic</label><br>

                <input type="text" id="catUrlInput" placeholder="Cat Photo URL" required> <br>
                <button type="button" id="submitBtn">Submit</button>
                <p id="message"></p>

            </form>
        </main>
        <footer>
            <p><small><small>
                ABCD</small></small>
            </p>

        </footer>
        <script>
  const input = document.getElementById("catUrlInput");
  const button = document.getElementById("submitBtn");
  const message = document.getElementById("message");
  const image = document.getElementById("catImage");

  button.addEventListener("click", function () {
    const url = input.value.trim();

    // 1. Empty check
    if (url === "") {
      message.textContent = "Please enter an image URL";
      return;
    }

    // 2. Basic URL check
    if (!url.startsWith("http")) {
      message.textContent = "Please enter a valid URL";
      return;
    }

    // 3. Update image
    image.src = url;
    message.textContent = "Image updated!";
  });

  // 4. Handle broken images
  image.onerror = function () {
    message.textContent = "Image could not be loaded. Try another URL.";
  };
</script>


    </body>
</html>
